<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Z Clear</title>
    <script>
      // Apply the saved theme before CSS paints so phones never see a flash.
      (function () {
        var saved;
        try {
          saved = window.localStorage.getItem('zclear-theme');
        } catch (_) {
          saved = null;
        }
        if (saved !== 'light' && saved !== 'dark' && saved !== 'cocoa') {
          saved =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', saved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
