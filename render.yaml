# Render Blueprint for Z Clear. Import this file with:
#   Dashboard -> New + -> Blueprint -> mwemmz/z-clear -> branch master
#
# NEVER put real credentials here. Keys marked `sync: false` are prompted for
# in the Render dashboard and are never written back to this repository.
# See docs/render-deploy.md before the first deploy.

services:
  # NestJS API on the free plan. preDeployCommand is paid-only, so the
  # idempotent migrations and least-privilege grants run at process start.
  # DATABASE_URL / DATABASE_MIGRATION_URL point at Neon (no DB in this Blueprint).
  - type: web
    name: zclear-api
    runtime: node
    region: oregon
    plan: free
    branch: master
    autoDeployTrigger: checksPass
    # Render's filesystem is read-only under /usr/bin, so do not write
    # Corepack system shims there. `corepack pnpm` uses the version pinned in
    # package.json without replacing /usr/bin/pnpm.
    buildCommand: >-
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm --filter @zclear/api... build
    # Render injects PORT; the API reads API_PORT. Map it explicitly.
    # node-pg-migrate up is a no-op when the schema is current. The hosted demo
    # seed runs only on first startup; a DB marker skips later restarts.
    startCommand: >-
      corepack pnpm --filter @zclear/api db:migrate &&
      corepack pnpm --filter @zclear/api db:grant &&
      if [ "$HOSTED_DEMO_SEED_ONCE" = "true" ]; then corepack pnpm --filter @zclear/api db:seed:hosted; fi &&
      API_PORT="$PORT" corepack pnpm --filter @zclear/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: API_BASE_URL
        value: https://zclear-api.onrender.com
      - key: WEB_BASE_URL
        value: https://zclear-web.onrender.com
      - key: CORS_ALLOWLIST
        value: https://zclear-web.onrender.com
      - key: COOKIE_SECURE
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false
      # The API must not connect as the schema owner or RLS is bypassed.
      - key: APP_DB_ROLE
        value: zclear_app
      # Render generates a random base64 value; no secret in source control.
      - key: AUTH_JWT_SECRET
        generateValue: true
      # Opt-in hosted demo: first successful boot seeds once, later boots skip.
      - key: HOSTED_DEMO_SEED_ONCE
        value: 'true'
      # Set once in the Render dashboard; never stored in source control.
      - key: HOSTED_DEMO_PASSWORD
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      - key: SIGNED_URL_TTL_SECONDS
        value: '300'
      # No AV daemon is bundled. Set clamav only with an external clamd.
      - key: SCAN_PROVIDER
        value: noop
      - key: NOTIFICATION_PROVIDER
        value: mock
      - key: FEATURE_NOTIFICATIONS
        value: 'false'
      - key: FEATURE_AI
        value: 'false'

  # React/Vite client. VITE_ variables are baked in at BUILD time.
  - type: web
    name: zclear-web
    runtime: static
    branch: master
    autoDeployTrigger: checksPass
    buildCommand: >-
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm --filter @zclear/web... build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          name: zclear-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
